[project]
version = "0.1.0"
name = "portfolio"
description = "Software Engineering Portfolio"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.52",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.52.4",
]

# =============================================================================
# Development Dependencies.
# =============================================================================

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-faker>=2.0.0",
    "types-python-jose>=3.5.0.20260408",
]

# =============================================================================
# Pyright Configurations.
# =============================================================================

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = false

# =============================================================================
# Black Formatter Configurations.
# =============================================================================

[tool.black]
line-length = 88

# =============================================================================
# Ishort Formatter Configurations.
# =============================================================================

[tool.isort]
profile = "black"

# =============================================================================
# Disable Ruff Rules for Test Cases.
# =============================================================================

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

# =============================================================================
# Pytest Configurations.
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["error"]

addopts = """
--strict-markers
--strict-config
--tb=short
--cov=app
--cov-report=term-missing
--cov-report=html
--cov-report=xml
--no-cov-on-fail
"""

markers = [
    "unit: tests for isolated units with no external dependencies",
    "hasher: tests for isolated units only for haser",
    "api: tests covering FastAPI HTTP endpoints and request/response flows",
    "health: tests for health-check and readiness endpoints",
    "auth: tests for authentication and authorization behaviors",
    "register: tests for user registration endpoints and flows",
    "login: tests for user login endpoints and flows",
    "refresh: tests for token refresh endpoints and flows",
    "logout: tests for user logout endpoints and flows",
    "me: tests for authenticated user endpoints and flows",
    "integration: tests exercising multiple real application components together",
    "slow: tests expected to run noticeably longer than standard unit or API checks",
    "e2e: end-to-end tests covering complete business workflows across the system",
    "auth_workflow: end-to-end tests covering complete auth workflow",
]

# =============================================================================
# Pytest Coverage Configurations.
# =============================================================================

[tool.coverage.run]
branch = true
source = ["app"]

# =============================================================================
# Pytest Coverage Report Configurations.
# =============================================================================

[tool.coverage.report]
# fail_under = 85
show_missing = true
skip_covered = true
