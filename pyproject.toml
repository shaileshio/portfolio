[project]
name = "portfolio-builder"
version = "0.1.0"
description = "Production-grade AI-powered engineering portfolio builder"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.1",
    "fastapi-swagger-ui-theme>=0.1.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.52",
    "uuid6>=2025.0.1",
    "uvicorn[standard]>=0.52.4",
]

# =============================================================================
# Development Dependencies.
# =============================================================================

[dependency-groups]
dev = [
    "fastapi-swagger-ui-theme>=0.1.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-faker>=2.0.0",
    "types-python-jose>=3.5.0.20260408",
]

# =============================================================================
# Pyright Configurations.
# =============================================================================

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUntypedFunctionDecorator = false

# =============================================================================
# Black Formatter Configurations.
# =============================================================================

[tool.black]
line-length = 88

# =============================================================================
# Ishort Formatter Configurations.
# =============================================================================

[tool.isort]
profile = "black"

# =============================================================================
# Disable Ruff Rules for Test Cases.
# =============================================================================

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

# =============================================================================
# Pytest Configurations.
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
addopts = """
--strict-markers
--strict-config
--tb=short
--cov=app
--cov-report=term-missing
--cov-report=html
--cov-report=xml
--no-cov-on-fail
"""
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = ["error"]
markers = [
    "unit: isolated unit tests with no external infrastructure",
    "api: FastAPI HTTP/API tests",
    "integration: tests involving multiple real application components",
    "e2e: end-to-end business workflow tests",
    "slow: tests that take significantly longer to execute",
]

# =============================================================================
# Pytest Coverage Configurations.
# =============================================================================

[tool.coverage.run]
branch = true
source = ["app"]

# =============================================================================
# Pytest Coverage Report Configurations.
# =============================================================================

[tool.coverage.report]
# fail_under = 85
show_missing = true
skip_covered = true
